name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  psscriptanalyzer:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify every PowerShell file parses
        shell: pwsh
        run: |
          $failed = $false
          $root = (Get-Location).Path
          Get-ChildItem -Path . -Recurse -File |
              Where-Object { $_.Extension -in '.ps1', '.psm1', '.psd1' } |
              ForEach-Object {
                  $parseErrors = $null
                  [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors) | Out-Null
                  if ($parseErrors.Count -gt 0) {
                      $failed = $true
                      $rel = $_.FullName.Substring($root.Length + 1).Replace('\', '/')
                      foreach ($e in $parseErrors) {
                          Write-Host "::error file=$rel,line=$($e.Extent.StartLineNumber),col=$($e.Extent.StartColumnNumber)::$($e.Message)"
                      }
                  }
              }
          if ($failed) {
              $Host.SetShouldExit(1)
              exit 1
          }
          Write-Host 'All PowerShell files parse.'

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          ./tools/Install-GalleryModule.ps1 -Name PSScriptAnalyzer
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $results | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize | Out-String -Width 200 | Write-Host
          $errors = @($results | Where-Object Severity -eq 'Error')
          Write-Host "Errors: $($errors.Count), Warnings: $(@($results | Where-Object Severity -eq 'Warning').Count)"
          if ($errors.Count -gt 0) {
              $Host.SetShouldExit(1)
              exit 1
          }

  pester:
    name: Repository Standards (Pester)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Lab 3.1's and the API-version suites compile templates through tools/BicepCli.psm1,
      # which takes the `bicep` on PATH - the binary the deploy scripts compile with. The
      # standalone release, not `az bicep install`: that copy lives under ~/.azure/bin where
      # only the Azure CLI looks, a second toolchain that can be a second version (#144).
      - name: Install Bicep CLI
        run: |
          curl -fsSLo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x ./bicep
          sudo mv ./bicep /usr/local/bin/bicep
          bicep --version

      # The outcome is decided here rather than left to Pester's own `-CI` exit. GitHub runs
      # this step as `pwsh -command`, whose exit code is whatever the host was last told to
      # use - and the suite itself runs tools/Invoke-LabCycle.ps1 in-process, which ends with
      # $Host.SetShouldExit(0). That pins the step to 0 and swallows any later `exit`, which
      # is how 5 failing tests passed as a green check (#128). Setting the code on the host
      # immediately before the `exit` is the same guard the lab scripts carry for #104.
      - name: Run Pester tests
        shell: pwsh
        run: |
          ./tools/Install-GalleryModule.ps1 -Name Pester -MinimumVersion 5.5 -MaximumVersion 5.99

          # Lab-local suites (module-*/**/tests/*.Tests.ps1) run alongside the repo-wide ones
          # in tests/. They only ever ran when someone invoked them by hand, which is how the
          # Module 1 README suite went on asserting a Mermaid block after ADR-0004 had
          # replaced it, unnoticed (#77). docs/powershell-standards.md section 6 states the rule.
          #
          # Module directories first, then recurse: `Get-ChildItem -Path 'module-*' -Recurse -File
          # -Filter` returns nothing at all on pwsh 7.6 (the wildcard path and -File do not
          # combine), and an empty list here would pass as a green check.
          $labSuites = @(Get-ChildItem -Directory -Filter 'module-*' | Get-ChildItem -Recurse -File -Filter '*.Tests.ps1' | ForEach-Object FullName)
          Write-Host "Lab-local suites: $($labSuites.Count)"
          $labSuites | ForEach-Object { Write-Host "  $_" }

          if ($labSuites.Count -eq 0) {
              Write-Host '::error::No lab-local Pester suite was discovered - the module-* discovery is broken.'
              $Host.SetShouldExit(1)
              exit 1
          }

          # -PassThru rather than a [PesterConfiguration] literal: Install-Module does not
          # load the assembly, so the type is unresolvable at parse time in a fresh session.
          $result = Invoke-Pester -Path (@('./tests') + $labSuites) -PassThru

          if ($null -eq $result) {
              Write-Host '::error::Invoke-Pester returned no result object - the run did not complete.'
              $Host.SetShouldExit(1)
              exit 1
          }

          Write-Host "Passed: $($result.PassedCount), Failed: $($result.FailedCount), Skipped: $($result.SkippedCount)"

          if ($result.FailedCount -gt 0 -or $result.FailedBlocksCount -gt 0 -or $result.FailedContainersCount -gt 0) {
              Write-Host "::error::Pester reported $($result.FailedCount) failed test(s)."
              $Host.SetShouldExit(1)
              exit 1
          }

          # A floor on the discovered test count (#544): a discovery regression that drops most
          # suites would otherwise stay green. tests/.pester-min-count holds one integer, about
          # 90 percent of the count when it was set; raise it when the suite grows.
          $minCount = [int](Get-Content -LiteralPath ./tests/.pester-min-count -Raw).Trim()
          Write-Host "Tests discovered: $($result.TotalCount), minimum: $minCount"
          if ($result.TotalCount -lt $minCount) {
              Write-Host "::error::Pester discovered $($result.TotalCount) test(s), below the minimum $minCount in tests/.pester-min-count - suites were lost from discovery."
              $Host.SetShouldExit(1)
              exit 1
          }

          # Success is stated just as explicitly. GitHub appends `exit $LASTEXITCODE` to a pwsh
          # step, and suites that run a script in a child pwsh leave that child's exit code in
          # $LASTEXITCODE (Remove-LabCycle.ps1's 5 for "every check failed"), which would fail a
          # green run.
          $Host.SetShouldExit(0)
          exit 0

  bicep:
    name: Bicep Build (Linter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Same standalone install as the pester job, for the same reason (#144).
      - name: Install Bicep CLI
        run: |
          curl -fsSLo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x ./bicep
          sudo mv ./bicep /usr/local/bin/bicep
          bicep --version

      - name: Build all Bicep entry points
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter '*.bicep' | Where-Object FullName -NotMatch '[\\/]modules[\\/]' | ForEach-Object {
              Write-Host "::group::$($_.FullName)"
              bicep build $_.FullName --stdout 1>$null
              if ($LASTEXITCODE -ne 0) { $failed = $true }
              Write-Host '::endgroup::'
          }
          if ($failed) {
              $Host.SetShouldExit(1)
              exit 1
          }

      - name: Build all Bicep parameter files
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter '*.bicepparam' | ForEach-Object {
              Write-Host "::group::$($_.FullName)"
              bicep build-params $_.FullName --stdout 1>$null
              if ($LASTEXITCODE -ne 0) { $failed = $true }
              Write-Host '::endgroup::'
          }
          if ($failed) {
              $Host.SetShouldExit(1)
              exit 1
          }

  markdownlint:
    name: Markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          config: .markdownlint.jsonc
          globs: |
            **/*.md
            !node_modules
            # CHANGELOG.md is generated by release-please (ADR-0007) in its own list
            # style; linting it would fail every Release PR.
            !CHANGELOG.md

  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  identifying-data:
    name: Identifying Data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # GUIDs, e-mail addresses and Windows user paths outside the reviewed allowlist, #523.
      # Fails on an empty scan and on a binary file it cannot read; the log shows masked values only.
      - name: Check tracked files for identifying data
        shell: pwsh
        run: |
          ./tools/Test-IdentifyingData.ps1
          if ($LASTEXITCODE -ne 0) {
            $Host.SetShouldExit($LASTEXITCODE)
            exit $LASTEXITCODE
          }

  bicep-security:
    name: Bicep Security (PSRule)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Same standalone install as the bicep job (#144); PSRule expands the templates with it.
      - name: Install Bicep CLI
        run: |
          curl -fsSLo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          chmod +x ./bicep
          sudo mv ./bicep /usr/local/bin/bicep
          bicep --version

      - name: Install PSRule for Azure
        shell: pwsh
        run: ./tools/Install-GalleryModule.ps1 -Name PSRule.Rules.Azure -MinimumVersion 1.47.0 -MaximumVersion 1.47.99

      # Findings outside tools/bicep-security-baseline.psd1, a file PSRule could not analyse and
      # is not named there, or an empty analysis fail the job, #522.
      - name: Assess the Bicep templates
        shell: pwsh
        run: |
          ./tools/Invoke-BicepSecurityCheck.ps1
          if ($LASTEXITCODE -ne 0) {
            $Host.SetShouldExit($LASTEXITCODE)
            exit $LASTEXITCODE
          }
