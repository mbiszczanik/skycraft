name: Lint

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  psscriptanalyzer:
    name: PSScriptAnalyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify every PowerShell file parses
        shell: pwsh
        run: |
          $failed = $false
          $root = (Get-Location).Path
          Get-ChildItem -Path . -Recurse -File |
              Where-Object { $_.Extension -in '.ps1', '.psm1', '.psd1' } |
              ForEach-Object {
                  $parseErrors = $null
                  [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors) | Out-Null
                  if ($parseErrors.Count -gt 0) {
                      $failed = $true
                      $rel = $_.FullName.Substring($root.Length + 1).Replace('\', '/')
                      foreach ($e in $parseErrors) {
                          Write-Host "::error file=$rel,line=$($e.Extent.StartLineNumber),col=$($e.Extent.StartColumnNumber)::$($e.Message)"
                      }
                  }
              }
          if ($failed) { exit 1 }
          Write-Host 'All PowerShell files parse.'

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $results | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize | Out-String -Width 200 | Write-Host
          $errors = @($results | Where-Object Severity -eq 'Error')
          Write-Host "Errors: $($errors.Count), Warnings: $(@($results | Where-Object Severity -eq 'Warning').Count)"
          if ($errors.Count -gt 0) { exit 1 }

  pester:
    name: Repository Standards (Pester)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run Pester tests
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.5 -MaximumVersion 5.99 -Force -Scope CurrentUser
          Invoke-Pester -Path ./tests -CI

  bicep:
    name: Bicep Build (Linter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Bicep CLI
        run: az bicep install

      - name: Build all Bicep entry points
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter '*.bicep' | Where-Object FullName -NotMatch '[\\/]modules[\\/]' | ForEach-Object {
              Write-Host "::group::$($_.FullName)"
              az bicep build --file $_.FullName --stdout 1>$null
              if ($LASTEXITCODE -ne 0) { $failed = $true }
              Write-Host '::endgroup::'
          }
          if ($failed) { exit 1 }

      - name: Build all Bicep parameter files
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter '*.bicepparam' | ForEach-Object {
              Write-Host "::group::$($_.FullName)"
              az bicep build-params --file $_.FullName --stdout 1>$null
              if ($LASTEXITCODE -ne 0) { $failed = $true }
              Write-Host '::endgroup::'
          }
          if ($failed) { exit 1 }

  markdownlint:
    name: Markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          config: .markdownlint.jsonc
          globs: |
            **/*.md
            !node_modules

  gitleaks:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
